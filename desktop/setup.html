<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMS COMMAND — Подготовка</title><style>*{box-sizing:border-box}body{margin:0;background:#101724;color:#f8f5f6;font:15px 'Bahnschrift','Segoe UI Variable','Segoe UI',Arial,sans-serif;display:grid;place-items:center;min-height:100vh;background-image:radial-gradient(circle at 72% 5%,#70334e70,transparent 55%)}.wrap{max-width:430px;width:calc(100% - 40px)}.brand{color:#ff91a4;letter-spacing:2px;font-weight:800;font-size:13px}.panel{border:1px solid #f8849650;border-radius:22px;padding:36px;background:#1b2533;box-shadow:0 32px 100px #05080c8c}h1{font-size:29px;margin:16px 0 8px}p{color:#a5b1bf;line-height:1.6;margin:0 0 28px}label{display:block;margin:18px 0 7px;font-size:13px;color:#cdd4e1}input{background:#121a28;border:1px solid #605063;border-radius:11px;padding:14px;width:100%;font:inherit;color:#fff;outline:none}input:focus{border-color:#ff95a4;box-shadow:0 0 0 3px #ff7f9629}button{display:block;margin-top:25px;padding:15px;width:100%;background:#ed5770;border:0;border-radius:11px;font:700 15px 'Bahnschrift','Segoe UI Variable','Segoe UI',sans-serif;color:#ffffff;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.alert{font-size:13px;margin-top:12px;color:#ffb9ac;min-height:22px}.sub{font-size:12px;color:#96a4b8;margin-top:23px;text-align:center}</style></head><body><div class="wrap"><div class="brand">✚ &nbsp; EMS COMMAND / ГОСБОЛЬНИЦА</div><div class="panel"><h1>Последний этап настройки</h1><p>Установка завершена. Создай профиль администратора для доступа к управлению сотрудниками и доказательствами.</p><form id="form"><label for="username">Логин администратора</label><input id="username" autocomplete="username" pattern="[a-zA-Z0-9_.-]{3,32}" placeholder="admin" required><label for="displayName">Имя в системе</label><input id="displayName" placeholder="Главный врач" minlength="2" maxlength="60" required><label for="password">Пароль (не менее 12 символов)</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Повтори пароль</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="submit" type="submit">Завершить настройку и открыть EMS COMMAND</button><div id="error" class="alert" role="alert"></div></form><div class="sub">Локальный профиль · защищённый хэш пароля · без отправки данных в GitHub.</div></div></div><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const get=id=>document.getElementById(id).value;const err=document.getElementById('error');const btn=document.getElementById('submit');err.textContent='';if(get('password')!==get('confirm')){err.textContent='Пароли не совпадают';return;}btn.disabled=true;btn.textContent='Создание профиля...';try{const r=await window.emsSetup.create({username:get('username'),displayName:get('displayName'),password:get('password')});if(!r.ok){err.textContent=r.error;btn.disabled=false;btn.textContent='Завершить настройку и открыть EMS COMMAND';}else{btn.textContent='Запуск приложения...';}}catch(x){err.textContent=x.message;btn.disabled=false;}};</script></body></html>
