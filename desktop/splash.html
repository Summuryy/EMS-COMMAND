<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMS COMMAND — Launcher</title><style>
:root{color-scheme:dark;font-family:Bahnschrift,'Segoe UI Variable',Segoe UI,sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;color:#f5f6fa;background:#0a101a;display:grid;place-items:center}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 55% 65% at 67% 40%,#81283d46,transparent 75%),linear-gradient(145deg,#121c2b,#080d15);pointer-events:none}.grid{position:fixed;inset:0;opacity:.22;background-image:linear-gradient(#b6c8de14 1px,transparent 1px),linear-gradient(90deg,#b6c8de14 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,transparent,#000 45%,transparent)}main{position:relative;width:min(610px,85vw);padding:48px 46px;border:1px solid #ff778933;border-radius:24px;background:linear-gradient(125deg,#202330d9,#101721f5);box-shadow:0 28px 95px #000b,inset 0 1px #ffffff19;text-align:left}.header{display:flex;align-items:center;gap:19px}.seal{width:75px;height:75px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(130deg,#f36c7b,#b12a49);font-size:42px;box-shadow:0 0 38px #e83b5959,inset 0 1px #ffffff7c}.eyebrow{letter-spacing:.22em;color:#ff9ca9;font-size:10px;font-weight:900}.name{font-size:34px;font-weight:950;letter-spacing:-.035em;margin-top:5px}.sub{color:#a5b1c2;font-size:12px;letter-spacing:.08em;margin-top:4px}.wave{height:65px;margin:40px 0 22px;overflow:hidden}.wave svg{width:100%;height:100%;filter:drop-shadow(0 0 7px #ff6888);overflow:hidden}.beat{fill:none;stroke:#ff8496;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;animation:scroll 4.5s linear infinite}@keyframes scroll{to{transform:translateX(-240px)}}.loader{height:5px;border-radius:8px;background:#323b4d;overflow:hidden}.loader:after{content:'';display:block;width:35%;height:100%;border-radius:8px;background:linear-gradient(90deg,#d33f5a,#ff98a9);animation:load 1.6s ease-in-out infinite}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}.status{display:flex;justify-content:space-between;align-items:center;margin-top:17px;gap:18px;font-size:12px;color:#c2cad6}.status strong{color:#f1f4f9}.dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:#74e6ad;box-shadow:0 0 15px #74e6adb0;margin-right:7px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 2px #74e6ad}}footer{position:relative;text-align:center;margin-top:26px;color:#647486;font-size:10px;letter-spacing:.12em}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style></head><body><div class="grid"></div><div><main><div class="header"><div class="seal">✚</div><div><div class="eyebrow">DESKTOP LAUNCHER · RP</div><div class="name">EMS COMMAND</div><div class="sub">ГОСУДАРСТВЕННАЯ БОЛЬНИЦА / КУТУЗОВСКИЙ</div></div></div><div class="wave"><svg viewBox="0 0 240 54" preserveAspectRatio="none"><path class="beat" d="M0 28H27L35 26L42 30L49 28H63L69 37L76 6L84 48L93 19L100 28H150L157 26L164 30L171 28H185L191 37L198 6L206 48L215 19L222 28H267L275 26L282 30L289 28H303L309 37L316 6L324 48L333 19L340 28H390L397 26L404 30L411 28H425L431 37L438 6L446 48L455 19L462 28H480"/></svg></div><div class="loader"></div><div class="status"><span><i class="dot"></i><strong>Запуск локальной службы</strong></span><span id="launcher-status">Проверка соединения</span></div></main><footer>EMS COMMAND · LOCAL SECURE SESSION · NO GAME INJECTION</footer></div><script>if(window.emsUpdates){const el=document.getElementById("launcher-status");const labels={checking:"Проверка обновлений",available:"Новая версия найдена",downloading:"Загрузка обновления",ready:"Обновление готово",current:"Версия актуальна",unconfigured:"Обновления ещё не подключены",error:"Ошибка обновления"};const update=s=>{if(el&&s?.status&&labels[s.status])el.textContent=labels[s.status]+(s.status==="downloading"?" · "+Math.max(0,Math.min(100,Number(s.percent)||0))+"%":"")};window.emsUpdates.status().then(update).catch(()=>{});window.emsUpdates.onStatus(update)}</script></body></html>
