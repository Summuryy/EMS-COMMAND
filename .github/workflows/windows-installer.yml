name: Windows installer (test build)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Test
        run: npm test
      - name: Build installer (unsigned test artifact)
        run: npm run dist:win -- --publish never
      - name: Verify updater metadata and installer hashes
        shell: pwsh
        run: |
          $metadata = Get-Content dist/latest.yml -Raw
          $installers = @(Get-ChildItem dist -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, got $($installers.Count)" }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash.ToLower()
          $hashBase64 = [Convert]::ToBase64String([Convert]::FromHexString($hash))
          if (-not $metadata.Contains($hashBase64)) { throw 'latest.yml SHA-512 does not match installer' }
          if (-not $metadata.Contains($installer.Name)) { throw 'latest.yml does not reference installer' }
          Write-Host "Updater metadata verified for $($installer.Name)"
      - name: Smoke install NSIS on Windows
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist -Filter 'EMS-COMMAND-Setup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected exactly one installer" }
          $target = Join-Path $env:RUNNER_TEMP 'EMS-COMMAND-Smoke'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent NSIS installation failed: $($process.ExitCode)" }
          $installed = Join-Path $target 'EMS COMMAND.exe'
          if (-not (Test-Path $installed)) {
            Get-ChildItem $target -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw 'Installer completed but EMS COMMAND.exe was not found'
          }
          Write-Host 'Windows installer smoke test passed: executable installed'
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Path "dist/$($_.Name).sha256" -Encoding ascii
          }
      - name: Upload installer for review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: EMS-COMMAND-Windows-Installer-UNSIGNED
          path: |
            dist/*.exe
            dist/*.sha256
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
