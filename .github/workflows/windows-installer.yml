name: Windows installer (test build)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Test
        run: npm test
      - name: Build installer (unsigned test artifact)
        run: npm run dist:win
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Path "dist/$($_.Name).sha256" -Encoding ascii
          }
      - name: Upload installer for review
        uses: actions/upload-artifact@v4
        with:
          name: EMS-COMMAND-Windows-Installer-UNSIGNED
          path: |
            dist/*.exe
            dist/*.sha256
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
